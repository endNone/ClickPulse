name: Memory comparison

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Interface or recorder comparison
        type: choice
        options: [interface, recorder]
        default: interface
      baseline:
        description: Published baseline tag
        default: v0.3.0
        required: true
      candidate:
        description: Exact optimized source revision
        required: true
      platform:
        description: Measurement host
        type: choice
        options: [windows, linux]
        default: windows

permissions:
  contents: read

concurrency:
  group: memory-${{ github.ref }}-${{ inputs.candidate || github.sha }}-${{ inputs.scope }}-${{ inputs.platform || 'windows' }}
  cancel-in-progress: true

env:
  BASELINE_REF: ${{ inputs.baseline || 'v0.3.0' }}
  CANDIDATE_REF: ${{ inputs.candidate || github.sha }}

jobs:
  windows:
    if: inputs.scope != 'recorder' && inputs.platform != 'linux'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline || 'v0.3.0' }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Prepare isolated probes
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          python tools/scripts/measure_memory.py prepare baseline baseline-probe
          python tools/scripts/measure_memory.py prepare candidate candidate-probe
          New-Item -ItemType Directory -Path results | Out-Null
          systeminfo | Out-File results/system.txt
          git -C baseline rev-parse HEAD | Out-File results/baseline-source.txt
          git -C candidate rev-parse HEAD | Out-File results/candidate-source.txt
      - name: Measure 0.3.0 then optimized 0.3.1 on the same machine
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $pwd 'build'
          cargo +stable build --release --locked --manifest-path baseline-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/measure_memory.py run build/release/clickpulse.exe results/baseline --label "$env:BASELINE_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable clean --release -p clickpulse --manifest-path candidate-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --release --locked --manifest-path candidate-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/measure_memory.py run build/release/clickpulse.exe results/candidate --label "$env:CANDIDATE_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-memory-comparison
          path: results/
          retention-days: 14

  recorder:
    if: inputs.scope == 'recorder' && inputs.platform != 'linux'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline || 'v0.3.0' }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Prepare isolated probes
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          python tools/scripts/measure_runtime_memory.py prepare baseline baseline-probe
          python tools/scripts/measure_runtime_memory.py prepare candidate candidate-probe
          New-Item -ItemType Directory -Path results | Out-Null
          systeminfo | Out-File results/system.txt
          git -C baseline rev-parse HEAD | Out-File results/baseline-source.txt
          git -C candidate rev-parse HEAD | Out-File results/candidate-source.txt
      - name: Measure 0.3.0 then optimized 0.3.1 on the same machine
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $pwd 'build'
          cargo +stable build --release --locked --bin memory_runtime --manifest-path baseline-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/measure_runtime_memory.py run build/release/memory_runtime.exe results/baseline --label "$env:BASELINE_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable clean --release -p clickpulse --manifest-path candidate-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --release --locked --bin memory_runtime --manifest-path candidate-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/measure_runtime_memory.py run build/release/memory_runtime.exe results/candidate --label "$env:CANDIDATE_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-recorder-memory
          path: results/
          retention-days: 14

  linux:
    if: inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Desktop and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev fonts-noto-cjk xvfb openbox dbus-x11
          rustup toolchain install stable --profile minimal
      - name: Prepare isolated probes
        env:
          MEASUREMENT_SCOPE: ${{ inputs.scope }}
        run: |
          script=measure_memory.py
          if [ "$MEASUREMENT_SCOPE" = recorder ]; then script=measure_runtime_memory.py; fi
          python3 "tools/scripts/$script" prepare baseline baseline-probe
          python3 "tools/scripts/$script" prepare candidate candidate-probe
          mkdir results
          uname -a > results/system.txt
          lscpu >> results/system.txt
          echo 'Xvfb 1920x1080x24; Openbox; software rendering; hosted Ubuntu 24.04 x64' >> results/system.txt
          git -C baseline rev-parse HEAD > results/baseline-source.txt
          git -C candidate rev-parse HEAD > results/candidate-source.txt
      - name: Measure both versions on the same host
        env:
          MEASUREMENT_SCOPE: ${{ inputs.scope }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          export CARGO_TARGET_DIR="$PWD/build"
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash -euo pipefail -c '
            openbox > results/openbox.log 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true" EXIT
            script=measure_memory.py
            binary=clickpulse
            if [ "$MEASUREMENT_SCOPE" = recorder ]; then
              script=measure_runtime_memory.py
              binary=memory_runtime
            fi
            for name in baseline candidate; do
              cargo +stable clean --release -p clickpulse --manifest-path "$name-probe/Cargo.toml"
              cargo +stable build --release --locked --bin "$binary" --manifest-path "$name-probe/Cargo.toml"
              label="$BASELINE_REF"
              if [ "$name" = candidate ]; then label="$CANDIDATE_REF"; fi
              python3 "tools/scripts/$script" run "build/release/$binary" "results/$name" --label "$label"
            done
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-${{ inputs.scope }}-memory-comparison
          path: results/
          retention-days: 14
