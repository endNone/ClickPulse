name: Packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to package
        type: string
        required: false
        default: ''

    secrets:
      MACOS_SIGNING_P12_BASE64:
        required: false
      MACOS_SIGNING_P12_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  package:
    name: Package (${{ matrix.platform }})
    # Build alongside checks; the calling release job waits for both to succeed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            rust-target: aarch64-apple-darwin
          - os: windows-2025
            platform: windows-x64
            rust-target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            platform: macos-x64
            rust-target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable
      # In a reusable workflow github.workflow_ref identifies its caller.
      MACOS_REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve package version
        id: version
        shell: bash
        run: python scripts/release.py plan --github-output "$GITHUB_OUTPUT"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.rust-target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      - name: Import release signing identity
        if: runner.os == 'macOS' && env.MACOS_REQUIRE_RELEASE_SIGNING == '1'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: python scripts/macos_signing.py import
      - name: Build packages
        run: python scripts/build.py --target ${{ matrix.rust-target }}
      - name: Remove temporary release keychain
        if: always() && runner.os == 'macOS' && env.MACOS_REQUIRE_RELEASE_SIGNING == '1'
        run: python scripts/macos_signing.py cleanup
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClickPulse-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ClickPulse-${{ steps.version.outputs.version }}-${{ matrix.platform }}.dmg
            dist/ClickPulse-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
            dist/ClickPulse-${{ steps.version.outputs.version }}-${{ matrix.platform }}*.sha256
            dist/ClickPulse-${{ steps.version.outputs.version }}-${{ matrix.platform }}.manifest.json
      - name: Retain matching debug symbols separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Debug-symbols-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: dist/symbols/
