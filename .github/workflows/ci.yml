name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to check
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release tooling (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Packaging and release verification
        run: python -m unittest discover -s tests -p 'test_*.py'

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev notification-daemon xvfb dbus-x11
      - name: Format
        run: cargo +stable fmt --check
      - name: Rust tests
        env:
          CLICKPULSE_REQUIRE_SYMLINK_TEST: '1'
        run: cargo +stable test --all-targets --locked
      - name: Linux notification delivery
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            /usr/lib/notification-daemon/notification-daemon &
            notification_pid=$!
            trap "kill $notification_pid 2>/dev/null || true" EXIT
            gdbus wait --session --timeout 10 org.freedesktop.Notifications
            cargo +stable test --locked --bin clickpulse desktop::storage_status::tests::linux_notification_service_accepts_repeated_alerts -- --ignored --exact
          '
      - name: Linux native recovery dialogs
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- cargo +stable test --locked --lib native_dialogs_work_without_zenity -- --ignored --test-threads=1
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Portable interface tests
        run: node scripts/test-ui.cjs
      - name: Packaging boundaries
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build
        run: cargo +stable build --release --locked
