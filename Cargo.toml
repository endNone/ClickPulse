[package]
name = "clickpulse"
version = "0.1.0"
edition = "2024"
description = "Local keyboard and mouse activity statistics"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
base64 = "0.22.1"
png = "0.18.1"
tao = "0.35"
tray-icon = "0.24"
wry = { version = "0.55", features = ["transparent"] }
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
dispatch2 = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
